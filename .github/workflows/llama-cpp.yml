name: Run llama.cpp

on:
  workflow_dispatch:
    inputs:
      prompt:
        description: 'Prompt'
        required: true
        type: string
      model:
        description: 'Hugging Face model repository (e.g., ggml-org/Qwen3.5-0.8B-GGUF)'
        default: 'ggml-org/Qwen3.5-0.8B-GGUF'
        type: string
      swap_size:
        description: 'Swap size in GB'
        default: 8
        type: number

jobs:
  llama-cpp:
    runs-on: ubuntu-latest
    steps:
      - name: Add Swap
        run: |
          sudo dd if=/dev/zero of=/swapfile1 bs=1G count=${{ inputs.swap_size }} status=progress
          sudo chmod 600 /swapfile1
          sudo mkswap /swapfile1
          sudo swapon /swapfile1
          echo "Swap enabled:"
          free -h
          df -h

      - name: Cache llama.cpp binary
        id: cache-llama
        uses: actions/cache@v4
        with:
          path: ~/.local/bin/llama
          key: ${{ runner.os }}-llama-cpp-binary

      - name: Cache Hugging Face models
        uses: actions/cache@v4
        with:
          path: ~/.cache/llama.cpp
          key: ${{ runner.os }}-llama-cpp-models-${{ inputs.model }}

      - name: Install llama.cpp
        if: steps.cache-llama.outputs.cache-hit != 'true'
        run: |
          # Install llama.cpp using the official quick-start script
          curl -LsSf https://llama.app/install.sh | sh

      - name: Add llama.cpp to PATH
        run: echo "$HOME/.local/bin" >> $GITHUB_PATH

      - name: Run model
        id: model
        env:
          LLAMA_CACHE: ~/.cache/llama.cpp
        run: |
          # Run the model with the provided prompt.
          RESPONSE=$(llama cli -hf "${{ inputs.model }}" -p "${{ inputs.prompt }}" --single-turn --no-display-prompt 2>/dev/null)

          DELIMITER="EOF_${RANDOM}${RANDOM}${RANDOM}${RANDOM}"
          # Use GitHub Actions multiline output syntax to safely capture the response
          echo "response<<$DELIMITER" >> $GITHUB_OUTPUT
          echo "$RESPONSE" >> $GITHUB_OUTPUT
          echo "$DELIMITER" >> $GITHUB_OUTPUT

      - name: Write to Step Summary
        env:
          MODEL_RESPONSE: ${{ steps.model.outputs.response }}
        run: |
          printf "%s\n" "$MODEL_RESPONSE" >> $GITHUB_STEP_SUMMARY
