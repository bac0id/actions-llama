name: Run llama.cpp Web UI

on:
  workflow_dispatch:
    inputs:
      model:
        description: 'Hugging Face model repository'
        default: 'ggml-org/Qwen3.5-0.8B-GGUF'
        required: true
        type: string
      swap_size:
        description: 'Swap size'
        default: '16G'
        type: string
      duration:
        description: 'Duration (minutes)'
        default: 15
        type: number

jobs:
  llama-server:
    runs-on: ubuntu-latest
    environment: prod
    steps:
      - name: Add Swap
        run: |
          df -hT
          sudo fallocate -l ${{ inputs.swap_size }} /swapfile1
          sudo chmod 600 /swapfile1
          sudo mkswap /swapfile1
          sudo swapon /swapfile1
          echo "Swap enabled:"
          free -h
          df -hT

      - name: Cache llama.cpp binary
        id: cache-llama
        uses: actions/cache@v6
        with:
          path: ~/.local/bin/llama
          key: ${{ runner.os }}-llama-cpp-binary

      - name: Install llama.cpp
        if: steps.cache-llama.outputs.cache-hit != 'true'
        run: |
          curl -LsSf https://llama.app/install.sh | sh

      - name: Add llama.cpp to PATH
        run: echo "$HOME/.local/bin" >> $GITHUB_PATH

      - name: Start llama.cpp server and wait for health check
        run: |
          # Start the server in the background
          llama serve -v -hf ${{ inputs.model }} --host 127.0.0.1 --port 8080 --agent &

          echo "Waiting for server to be ready..."
          # Poll the /health endpoint until it returns ok
          for i in {1..200}; do
            if curl -s http://localhost:8080/health | grep -qi 'ok'; then
              echo "Server is successfully loaded and ready!"
              free -h
              exit 0
            fi
            sleep 3
          done

          echo "Server failed to start within the timeout period."
          exit 1

      - name: Setup SSH keys
        env:
          SSH_PRIVATE_KEY: ${{ secrets.LOCALHOST_RUN_SSH_PRIVATE_KEY }}
          SSH_PUBLIC_KEY: ${{ vars.LOCALHOST_RUN_SSH_PUBLIC_KEY }}
        run: |
          mkdir -p ~/.ssh
          echo "$SSH_PRIVATE_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          echo "$SSH_PUBLIC_KEY" > ~/.ssh/id_ed25519.pub
          chmod 644 ~/.ssh/id_ed25519.pub

          ssh-keyscan -H localhost.run >> ~/.ssh/known_hosts 2>/dev/null
          echo "SSH keys configured successfully."

      - name: Expose Web UI via localhost.run
        run: |
          ssh -o StrictHostKeyChecking=no -o ServerAliveInterval=60 -i ~/.ssh/id_ed25519 -R 80:127.0.0.1:8080 localhost.run

      - name: Keep alive
        run: |
          echo "Keep alive"
          sleep $(( ${{ inputs.duration }} * 60 ))
