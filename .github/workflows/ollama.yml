name: Run ollama

on:
  workflow_dispatch:
    inputs:
      prompt:
        description: 'Prompt'
        required: true
        type: string
      model:
        description: 'Ollama model to run'
        default: 'gemma4:e2b'
        type: string
      swap_size:
        description: 'Swap size in GB'
        default: 8
        type: number

jobs:
  ollama:
    runs-on: ubuntu-latest
    steps:
      - name: Add Swap
        run: |
          sudo dd if=/dev/zero of=/swapfile1 bs=1G count=${{ inputs.swap_size }} status=progress
          sudo chmod 600 /swapfile1
          sudo mkswap /swapfile1
          sudo swapon /swapfile1
          echo "Swap enabled:"
          free -h

      - name: Run model
        uses: ai-action/ollama-action@v2
        id: model
        with:
          model: ${{ inputs.model }}
          prompt: ${{ inputs.prompt }}

      - name: Write to Step Summary
        run: |
          echo "### 🤖 Model Response" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "$response" >> $GITHUB_STEP_SUMMARY
        env:
          response: ${{ steps.model.outputs.response }}
