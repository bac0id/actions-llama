name: Run DSH Web UI

on:
  workflow_dispatch:
    inputs:
      dsh_args:
        description: "DSH args"
        default: "--no-open"
        type: string
      port:
        description: "DSH listen port"
        default: 3080
        type: number
      duration:
        description: "Duration (minutes)"
        default: 15
        type: number

jobs:
  dsh:
    runs-on: ubuntu-latest
    environment: prod
    steps:
      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "lts/*"
          check-latest: true

      - name: Cache npm
        uses: actions/cache@v6
        with:
          path: ~/.npm
          key: ${{ runner.os }}-npm-dsh

      - name: Install DSH
        run: npm install -g @deepseek-ai/dsh

      - name: Verify dsh
        run: dsh --version || true

      - name: Start DSH Web UI
        run: |
          nohup dsh web --port ${{ inputs.port }} ${{ inputs.dsh_args }} > /tmp/dsh.log 2>&1 &
          disown || true

          echo "Waiting for DSH Web UI to be ready..."
          DSH_URL=""
          for i in {1..60}; do
            # dsh prints: http://127.0.0.1:PORT/?token=...
            DSH_URL=$(grep -oE "http://127\.0\.0\.1:${{ inputs.port }}/\?token=[^[:space:]]+" /tmp/dsh.log | head -n1 || true)
            if [ -n "$DSH_URL" ] && curl -sSf "$DSH_URL" >/dev/null 2>&1; then
              echo "DSH Web UI is up: $DSH_URL"
              break
            fi
            sleep 2
          done

          if [ -z "$DSH_URL" ] || ! curl -sSf "$DSH_URL" >/dev/null 2>&1; then
            echo "DSH Web UI failed to start within the timeout period."
            echo "----- dsh.log -----"
            cat /tmp/dsh.log || true
            exit 1
          fi

          TOKEN="${DSH_URL##*token=}"
          echo "DSH_TOKEN=$TOKEN" >> "$GITHUB_ENV"
          {
            echo "### DSH Web UI"
            echo ""
            echo "- Local: \`$DSH_URL\`"
            echo "- Token: \`$TOKEN\`"
            echo "- Via localhost.run: open the tunnel URL with \`/?token=$TOKEN\` appended."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Setup SSH keys
        env:
          SSH_PRIVATE_KEY: ${{ secrets.LOCALHOST_RUN_SSH_PRIVATE_KEY }}
          SSH_PUBLIC_KEY: ${{ vars.LOCALHOST_RUN_SSH_PUBLIC_KEY }}
        run: |
          mkdir -p ~/.ssh
          echo "$SSH_PRIVATE_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          echo "$SSH_PUBLIC_KEY" > ~/.ssh/id_ed25519.pub
          chmod 644 ~/.ssh/id_ed25519.pub

          ssh-keyscan -H localhost.run >> ~/.ssh/known_hosts 2>/dev/null
          echo "SSH keys configured successfully."

      - name: Expose Web UI via localhost.run
        run: |
          ssh -o StrictHostKeyChecking=no -o ServerAliveInterval=60 \
            -i ~/.ssh/id_ed25519 \
            -R 80:127.0.0.1:${{ inputs.port }} \
            localhost.run

      - name: Keep alive
        run: |
          echo "Keep alive"
          sleep $(( ${{ inputs.duration }} * 60 ))
